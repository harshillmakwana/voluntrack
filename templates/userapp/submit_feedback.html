<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Feedback | VolunTrack</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --green: #1a6b3a;
            --green-light: #2d9e58;
            --gold: #e8a020;
            --dark: #0d1f14;
            --bg: #f4f9f6;
            --border: #d0e6d8;
        }

        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .feedback-card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }

        .card-header-premium {
            background: var(--dark);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .card-header-premium h2 { font-family: 'Playfair Display', serif; margin: 0; font-size: 2rem; }
        .card-header-premium p { margin-top: 10px; opacity: 0.7; font-size: 1rem; }

        .feedback-body { padding: 40px; }

        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .star-rating input { display: none; }
        .star-rating label {
            font-size: 3rem;
            color: #ddd;
            cursor: pointer;
            transition: 0.3s;
        }
        .star-rating input:checked ~ label { color: var(--gold); }
        .star-rating label:hover, .star-rating label:hover ~ label { color: var(--gold); }

        .form-label { font-weight: 700; margin-bottom: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.8rem; }
        .form-control { 
            border-radius: 15px; 
            padding: 15px; 
            border: 1px solid var(--border); 
            resize: none;
            transition: 0.3s;
        }
        .form-control:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(26, 107, 58, 0.1); }

        .btn-submit {
            background: var(--green);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-submit:hover { background: var(--green-light); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(26, 107, 58, 0.2); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="feedback-card">
        <div class="card-header-premium">
            <h2>Your Opinion Matters</h2>
            <p>Tell us about your experience with <strong>{{ i.event_name.created_by }}</strong></p>
        </div>

        <div class="feedback-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="text-center mb-2">
                    <label class="form-label">How would you rate the event?</label>
                </div>
                
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required/><label for="star5" title="Amazing"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="Good"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star3" name="rating" value="3" /><label for="star3" title="Average"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="Poor"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star1" name="rating" value="1" /><label for="star1" title="Very Poor"><i class="fas fa-star"></i></label>
                </div>

                <div class="mb-4">
                    <label class="form-label">Share your thoughts</label>
                    <textarea name="comment" class="form-control" rows="5" placeholder="What did you like? What can be improved?" required></textarea>
                </div>

                <div class="p-3 bg-light rounded-4 mb-4 small text-muted">
                    <i class="fas fa-info-circle me-2"></i> Your feedback helps organizers improve and helps other volunteers find great opportunities.
                </div>

                <button type="submit" class="btn-submit">
                    Send My Feedback
                </button>
                
                <div class="text-center mt-3">
                    <a href="{% url 'booking_list' %}" class="text-decoration-none text-muted small">Skip for now</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
