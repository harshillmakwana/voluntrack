{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
{% comment %} <title>Check Out – VolunTrack</title> {% endcomment %}
<link rel="stylesheet" href="{% static 'adminapp/style.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">

<style>
       body {
            background-color: #f0f2f5;
            padding: 40px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 35px;
            max-width: 800px;
            margin: auto;
        }
        .form-title {
            color: #4e73df;
            font-weight: 700;
            margin-bottom: 30px;
            border-bottom: 2px solid #f8f9fc;
            padding-bottom: 10px;
        }
        .col-form-label {
            font-weight: 600;
            color: #444;
        }
        .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }
        .btn-submit {
            background: #4e73df;
            border: none;
            padding: 12px 35px;
            font-weight: 600;
            color: white;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background: #224abe;
            transform: translateY(-2px);
        }
    </style>


</style>
</head>
<body>
<div class="app-wrapper">
  <div class="main-content">
    <div class="page-body">
      <div class="row justify-content-center">



    <div class="container">
    <div class="form-card">
        <h2 class="form-title text-center">Attendance Registration</h2>
        
        <form method="POST">
            {% csrf_token %}    

            <div class="row mb-3">
                  <label class="col-sm-3 col-form-label">select Events</label>
                  <div class="col-sm-9">
                    <select class="form-select" name ="event" aria-label="Default select example">
                      <option selected>select Events</option>
                      {% for i in e_atte %}
                      <option value="{{ i.id }}">{{ i.event_name }}</option>
                      {% endfor %}
                    </select>
                  </div>
                </div>

            <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Volunteer Name</label>
                <div class="col-sm-9">
                    <input type="text" name="volunteer" class="form-control" maxlength="250" placeholder="Full Name" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Check-in Time</label>
                <div class="col-sm-9">
                    <input type="datetime-local" name="check_in_time" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Check-out Time</label>
                <div class="col-sm-9">
                    <input type="datetime-local" name="check_out_time" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Total Hours</label>
                <div class="col-sm-9">
                    <input type="number" name="total_hours" class="form-control" placeholder="e.g. 8" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Status</label>
                <div class="col-sm-9">
                    <input type="text" name="attendance_status" class="form-control" maxlength="50" placeholder="Present / Absent / Late" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Verified By</label>
                <div class="col-sm-9">
                    <input type="text" name="verified_by" class="form-control" maxlength="250" placeholder="Admin Name" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Is Active</label>
                <div class="col-sm-9">
                    <input type="text" name="is_active" class="form-control" maxlength="250" placeholder="Yes / No" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Created At</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" placeholder="Automatically set" readonly>
                </div>
            </div>

            <div class="row mb-4">
                <label class="col-sm-3 col-form-label">Updated At</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" placeholder="Automatically set" readonly>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-9 offset-sm-3">
                    <button type="submit" class="btn btn-primary btn-submit">Save Attendance</button>
                    <button type="reset" class="btn btn-outline-secondary ms-2">Reset</button>
                </div>
            </div>
        </form>
    </div>
</div>




        
      </div>
    </div>
  </div>   
</div>
<script>


const sb = `<aside class="sidebar"><div class="sidebar-brand"><div class="brand-icon">🤝</div>
<div><div class="brand-text">VolunTrack</div><span class="brand-sub">Community Platform</span></div></div>
<nav class="sidebar-nav"><div class="nav-label">Main</div><a class="nav-item" href="{% url "dashboard_view" %}"><span class="icon">⊞</span> Dashboard</a>
<a class="nav-item active" href="{% url "event_list_view" %}"><span class="icon">📅</span> Browse Events</a>
<a class="nav-item" href="{% url "my_applications_view" %}"><span class="icon">📋</span> My Applications</a>
<a class="nav-item" href="{% url "my_tasks_view" %}"><span class="icon">✅</span> My Tasks</a>

<a class="nav-item" href="{% url 'list_Category' %}"><span class="icon">✅</span>Category List</a>

<a class="nav-item" href="{% url 'list_Event' %}"><span class="icon">✅</span>Events List</a>

<a class="nav-item" href="{% url 'list_EventRole' %}"><span class="icon">✅</span>EventRole List</a>

<a class="nav-item" href="{% url 'list_VolunteerApplication' %}"><span class="icon">✅</span>VolunteerAppli List</a>

<a class="nav-item" href="{% url 'list_TaskAssignment' %}"><span class="icon">✅</span>Tasks Assigned List</a>

<a class="nav-item" href="{% url 'list_Attendance' %}"><span class="icon">✅</span>Attended List</a>



<a class="nav-item" href="{% url \'list_payments\' %}"><span class="icon">💰</span>Payment List</a>

document.querySelector('.app-wrapper').insertAdjacentHTML('afterbegin', sb);
{% comment %} document.querySelector('.main-content').insertAdjacentHTML('afterbegin', `<div class="topbar"><div><div class="page-title">Check Out</div><div class="page-sub">End your volunteer session</div></div><div class="topbar-actions"><button class="icon-btn">🔔</button></div></div>`); {% endcomment %}
</script>
</body>
</html>
