{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
{% comment %} <title>Check Out – VolunTrack</title> {% endcomment %}
<link rel="stylesheet" href="{% static 'adminapp/style.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">

<style>
        body {
            background-color: #f0f2f5;
            padding: 50px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 650px;
            margin: auto;
        }
        .form-title {
            color: #4e73df;
            font-weight: 700;
            margin-bottom: 30px;
            border-bottom: 2px solid #f8f9fc;
            padding-bottom: 10px;
        }
        .col-form-label {
            font-weight: 600;
            color: #444;
        }
        .form-control:focus, .form-check-input:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }
        .btn-submit {
            background: #4e73df;
            border: none;
            padding: 12px 40px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: 0.3s;
            border-radius: 8px;
        }
        .btn-submit:hover {
            background: #224abe;
            transform: translateY(-2px);
        }
        .form-check-input:checked {
            background-color: #4e73df;
            border-color: #4e73df;
        }
    </style>


</style>
</head>
<body>
<div class="app-wrapper">
  <div class="main-content">
    <div class="page-body">
      <div class="row justify-content-center">



        <div class="container">
    <div class="form-card">
        <h2 class="form-title text-center">Add New Category</h2>
        
        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label col-form-label">Category Name</label>
                <input type="text" name="category_name" class="form-control" maxlength="100" placeholder="Enter category name" required>
            </div>

            <div class="mb-4">
                <label class="form-label col-form-label">Category Description</label>
                <textarea name="category_description" class="form-control" rows="4" placeholder="Brief description about this category..."></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label col-form-label">Created At</label>
                <input type="text" class="form-control bg-light" value="Automatically generated" readonly>
                <small class="text-muted">This field is set automatically by the system.</small>
            </div>

            <div class="mb-4">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="is_active" id="isActive" checked>
                    <label class="form-check-label fw-bold" for="isActive">Is Active Category</label>
                </div>
            </div>

            <div class="mt-5">
                <button type="submit" class="btn btn-primary btn-submit">Save Category</button>
            </div>
        </form>
    </div>
</div>



        
      </div>
    </div>
  </div>
</div>
<script>


const sb = `<aside class="sidebar"><div class="sidebar-brand"><div class="brand-icon">🤝</div>
<div><div class="brand-text">VolunTrack</div><span class="brand-sub">Community Platform</span></div></div>
<nav class="sidebar-nav"><div class="nav-label">Main</div><a class="nav-item" href="{% url "dashboard_view_ad" %}"><span class="icon"></span> Dashboard</a>
<a class="nav-item active" href="{% url "event_list_view" %}"><span class="icon"></span> Browse Events</a>
<a class="nav-item" href="{% url "my_applications_view" %}"><span class="icon"></span> My Applications</a>
<a class="nav-item" href="{% url "my_tasks_view" %}"><span class="icon"></span> My Tasks</a>

<a class="nav-item" href="{% url 'list_Category' %}"><span class="icon"></span>Category List</a>

<a class="nav-item" href="{% url 'list_Event' %}"><span class="icon"></span>Events List</a>

<a class="nav-item" href="{% url 'list_EventRole' %}"><span class="icon"></span>EventRole List</a>

<a class="nav-item" href="{% url 'list_VolunteerApplication' %}"><span class="icon"></span>VolunteerAppli List</a>

<a class="nav-item" href="{% url 'list_TaskAssignment' %}"><span class="icon"></span>Tasks Assigned List</a>

<a class="nav-item" href="{% url 'list_Attendance' %}"><span class="icon"></span>Attended List</a>


<a class="nav-item" href="{% url 'list_payments' %}"><span class="icon"></span>Payment List</a>
<div class="nav-label">Attendance</div>
<a class="nav-item" href="{% url "checkin_view" %}"><span class="icon"></span> Check In</a>
<a class="nav-item" href="{% url "checkout_view" %}"><span class="icon"></span> Check Out</a>
<a class="nav-item" href="{% url "attendance_history_view" %}"><span class="icon"></span> Attendance History</a>
<a class="nav-item" href="{% url "certificates_view" %}"><span class="icon"></span> Certificates</a><div class="nav-label">Account</div>
<a class="nav-item" href="{% url "admin_profile" %}"><span class="icon">👤</span> Profile</a>
<a class="nav-item" href="{% url "logout_view" %}"><span class="icon">↩</span> Logout</a></nav>
<div class="sidebar-footer"><a href="{% url "admin_profile" %}" class="user-card"><div class="avatar">AK</div>
<div class="user-info"><div class="name">Aryan Kumar</div><div class="role">Volunteer</div></div></a></div></aside>`;
document.querySelector('.app-wrapper').insertAdjacentHTML('afterbegin', sb);
{% comment %} document.querySelector('.main-content').insertAdjacentHTML('afterbegin', `<div class="topbar"><div><div class="page-title">Check Out</div><div class="page-sub">End your volunteer session</div></div><div class="topbar-actions"><button class="icon-btn">🔔</button></div></div>`); {% endcomment %}
</script>
</body>
</html>
